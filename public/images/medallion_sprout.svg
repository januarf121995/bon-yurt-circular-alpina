<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="soil" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#5D4037"/>
      <stop offset="100%" stop-color="#3E2723"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="100%" stop-color="#C8E6C9"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#81C784"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>
  <!-- Soil mound -->
  <path d="M 20 180 Q 100 130 180 180 Z" fill="url(#soil)"/>
  <!-- Sprout stem -->
  <path d="M 100 150 Q 95 110 100 85" stroke="#4CAF50" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Left leaf -->
  <path d="M 98 105 C 70 95 65 65 95 75 C 98 85 98 95 98 105 Z" fill="url(#leaf)"/>
  <!-- Right leaf -->
  <path d="M 100 95 C 130 85 135 55 105 65 C 102 75 101 85 100 95 Z" fill="url(#leaf)"/>
  <!-- Sun ray sparkle -->
  <circle cx="150" cy="45" r="12" fill="#FFD54F" opacity="0.8"/>
</svg>
