<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="spoonbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EFEBE9"/>
      <stop offset="100%" stop-color="#D7CCC8"/>
    </linearGradient>
    <linearGradient id="cookie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D7CCC8"/>
      <stop offset="50%" stop-color="#BCAAA4"/>
      <stop offset="100%" stop-color="#8D6E63"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#spoonbg)"/>
  <!-- Baked biscuit spoon -->
  <g transform="rotate(-30 100 100)">
    <!-- Spoon head -->
    <ellipse cx="65" cy="100" rx="30" ry="22" fill="#A1887F" stroke="#5D4037" stroke-width="3"/>
    <!-- Spoon handle -->
    <path d="M 90 94 L 165 92 Q 175 100 165 108 L 90 106 Z" fill="#8D6E63" stroke="#5D4037" stroke-width="3"/>
    <!-- Cookie crumbs texture -->
    <circle cx="60" cy="95" r="3" fill="#4E342E"/>
    <circle cx="72" cy="103" r="2.5" fill="#4E342E"/>
    <circle cx="55" cy="108" r="2" fill="#4E342E"/>
    <circle cx="120" cy="99" r="2" fill="#4E342E"/>
    <circle cx="145" cy="101" r="2.5" fill="#4E342E"/>
  </g>
  <!-- Topping sprinkles -->
  <circle cx="140" cy="50" r="5" fill="#5D4037"/>
  <circle cx="155" cy="65" r="4" fill="#795548"/>
  <circle cx="130" cy="70" r="3" fill="#8D6E63"/>
</svg>
